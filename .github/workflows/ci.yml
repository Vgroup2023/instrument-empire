name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check navigation covers every dashboard page
        run: npm run check:nav

      - name: Counsel (AI lawyer) rule tests
        run: npm run qa:counsel

      - name: Time, scheduling and Payroll Based Journal tests
        run: npm run qa:workforce

      - name: US payroll tax tests
        run: npm run qa:payroll

      - name: Dashboard calculation tests
        run: npm run qa:dashboard

      - name: CRM calculation tests
        run: npm run qa:crm

      - name: Accounts and access tests
        run: npm run qa:auth

      - name: Team hand-off tests
        run: npm run qa:handoffs

      - name: Build
        run: npm run build
        env:
          # Dummy values so build-time env access (module-scope getters that
          # only throw when actually called) doesn't fail the build step.
          SESSION_SECRET: ci-build-placeholder-secret
          APP_PASSWORD: ci-build-placeholder-password
          QBO_CLIENT_ID: ci-build-placeholder
          QBO_CLIENT_SECRET: ci-build-placeholder
          QBO_REDIRECT_URI: http://localhost:3000/api/auth/callback
