:root{--navy9:#030814;--navy8:#050d20;--navy7:#081634;--navy6:#0d2250;--navy5:#14316f;--gold:#d9a93a;--gold2:#f6d983;--gold3:#9a7220;--ink:#eef3ff;--mute:#93a6cf;--line:rgba(255,255,255,.09);--warn:#ffb347;--bad:#ff7a7a;--ok:#78e0b4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:"Segoe UI","Helvetica Neue",Inter,Roboto,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;cursor:default}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1920px;height:1080px;flex:none;transform-origin:center center;overflow:hidden;background:radial-gradient(1400px 900px at 70% 20%,#12307a 0%,#081634 45%,#030814 100%)}
canvas#dust{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;mix-blend-mode:screen}
.grain{position:absolute;inset:-50%;width:200%;height:200%;opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.bars::before,.bars::after{content:"";position:absolute;left:0;right:0;height:46px;background:#000;z-index:50}
.bars::before{top:0}.bars::after{bottom:0}
.scene{position:absolute;inset:0;opacity:0}
.cam{position:absolute;inset:0;transform-origin:50% 50%}
.abs{position:absolute}
.fade{opacity:0}
/* chrome */
#hud{position:absolute;inset:0;z-index:40;pointer-events:none}
.brandmini{position:absolute;left:84px;top:62px;display:flex;align-items:center;gap:16px;font-weight:700;letter-spacing:.22em;font-size:22px;color:var(--gold2)}
.brandmini i{width:44px;height:44px;border-radius:12px;background:var(--navy9) var(--logo) center/cover;border:1px solid rgba(217,169,58,.55)}
#tc{position:absolute;right:84px;top:68px;font-variant-numeric:tabular-nums;letter-spacing:.14em;font-size:22px;color:var(--mute)}
#tc b{color:var(--gold2);font-weight:600}
.lower{position:absolute;left:84px;bottom:140px;display:flex;align-items:flex-end;gap:26px}
.lower .n{font-size:120px;line-height:.8;font-weight:800;color:transparent;-webkit-text-stroke:2px var(--gold);letter-spacing:-.02em}
.lower .t{font-size:56px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1}
.lower .s{font-size:30px;color:var(--mute);margin-top:10px;letter-spacing:.02em}
.lower .rule{width:6px;align-self:stretch;background:linear-gradient(var(--gold2),var(--gold3));border-radius:3px}
#prog{position:absolute;left:84px;right:84px;bottom:78px;height:8px;display:flex;gap:10px}
#prog span{flex:1;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;position:relative}
#prog span i{position:absolute;inset:0;background:linear-gradient(90deg,var(--gold3),var(--gold2));transform-origin:left;transform:scaleX(0)}
/* windows */
.win{position:absolute;background:linear-gradient(180deg,rgba(14,30,66,.92),rgba(7,16,38,.96));border:1px solid rgba(217,169,58,.28);border-radius:26px;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03) inset,0 0 80px rgba(217,169,58,.06);overflow:hidden}
.win .tb{height:64px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid var(--line);font-size:24px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.win .tb i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.18)}
.win .tb i:first-child{background:var(--gold)}
.win .tb em{margin-left:auto;font-style:normal;color:var(--gold2)}
.card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;padding:22px 26px}
.lbl{font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:600}
.big{font-weight:800;letter-spacing:-.01em}
.gold{color:var(--gold2)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;font-size:22px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid}
.p-gold{color:var(--gold2);border-color:rgba(217,169,58,.6);background:rgba(217,169,58,.12)}
.p-bad{color:var(--bad);border-color:rgba(255,122,122,.55);background:rgba(255,122,122,.1)}
.p-warn{color:var(--warn);border-color:rgba(255,179,71,.55);background:rgba(255,179,71,.1)}
.p-ok{color:var(--ok);border-color:rgba(120,224,180,.5);background:rgba(120,224,180,.08)}
.p-mute{color:var(--mute);border-color:var(--line);background:rgba(255,255,255,.04)}
.row{display:flex;align-items:center}
.gbtn{display:inline-block;padding:20px 40px;border-radius:16px;font-weight:800;font-size:32px;letter-spacing:.1em;text-transform:uppercase;color:#1a1204;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 10px 40px rgba(217,169,58,.35)}
.glow{box-shadow:0 0 0 2px var(--gold),0 0 60px rgba(217,169,58,.45)!important}
.check{display:inline-flex;width:40px;height:40px;border-radius:50%;align-items:center;justify-content:center;font-weight:900;font-size:26px;background:var(--gold);color:#1a1204}
.dot{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.18);flex:none}
.sheen{position:absolute;top:0;bottom:0;width:240px;background:linear-gradient(100deg,transparent,rgba(246,217,131,.16),transparent);transform:translateX(-400px) skewX(-18deg);pointer-events:none}
#replay{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);z-index:60;font-size:24px;letter-spacing:.2em;color:var(--mute);opacity:0;transition:opacity .4s;text-transform:uppercase}
#hint{position:absolute;right:84px;bottom:112px;z-index:60;font-size:22px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;transition:opacity .6s}

:root{--silverblack:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 1px,rgba(0,0,0,0) 1px,rgba(0,0,0,0) 3px),linear-gradient(135deg,#07080a 0%,#1c1f25 24%,#4a4f5a 50%,#1c1f25 76%,#07080a 100%)}
#stage{background:linear-gradient(180deg,#0a1a35 0%,#122a55 55%,#0a1a35 100%)}
.appwrap{position:absolute;width:1560px;height:672px;border-radius:22px;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08),0 0 80px rgba(217,169,58,.08);background:#fff}
.app{width:1200px;height:517px;display:flex;transform:scale(1.3);transform-origin:0 0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#0f172a;background:#fff;font-size:14px}
.side{width:256px;flex:none;background:linear-gradient(180deg,#0a1a35,#1e3a6e);border-right:1px solid rgba(255,255,255,.1);overflow:hidden}
.logoblk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px;border-bottom:1px solid rgba(255,255,255,.1)}
.logoblk .lg{width:180px;height:120px;background:var(--logo) center/cover}
.logoblk .nm{font-size:12px;font-weight:600;letter-spacing:.05em;color:#f1f5f9;text-transform:uppercase}
.tgl2{font-size:11px;color:#7c828c}
.grp{padding:16px 12px 0}.gl{font-size:11px;font-weight:600;letter-spacing:.08em;color:#7c828c;padding:0 8px 6px}
.it{display:flex;gap:12px;align-items:center;padding:8px 12px;border-radius:8px;font-size:14px;color:#e2e8f0;white-space:nowrap}.it.on{background:rgba(255,255,255,.12);color:#fff}
.mainc{flex:1;display:flex;flex-direction:column;min-width:0}
.topb{height:64px;flex:none;background:linear-gradient(180deg,#0a1a35,#1e3a6e);display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:#fff}
.topb b{display:block;font-size:14px;font-weight:600}.topb span{font-size:12px;color:#94a3b8}.topb em{font-style:normal;font-size:14px;color:#e2e8f0}
.page{flex:1;overflow:hidden;position:relative;background:#fff}
.pg{padding:26px 28px}
.hd{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
.h1{font-size:20px;font-weight:600;color:#0f172a}.ds{font-size:13px;color:#64748b;margin-top:4px;max-width:560px;line-height:1.35}
.hb{display:flex;gap:8px;flex:none}
.bt{display:inline-block;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap}
.bt.p{background:#0070e6;color:#fff}.bt.s{background:#fff;border:1px solid #cbd5e1;color:#334155}.bt.n{color:#475569}
.apc{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 1px 6px -1px rgba(0,0,0,.06)}
.bd{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.bd.g{background:#faf0cb;color:#6f481c}.bd.r{background:#fee2e2;color:#b91c1c}.bd.e{background:#d1fae5;color:#047857}.bd.n{background:#f1f5f9;color:#475569}.bd.b{background:#cdedff;color:#0059b8}
.bd i{font-style:normal}
small{font-size:11px;color:#64748b}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px}

<body><div id="viewport"><div id="stage">
<canvas id="dust" width="1920" height="1080"></canvas>
<div id="hud"></div>
<div class="grain"></div><div class="vignette"></div><div class="bars"></div>
<div id="hint">Click for sound · Space pause · R replay · F fullscreen</div>
<div id="replay">Press R to replay</div>
</div></div>
<script>(() => {
'use strict';
const TOTAL = 45;
const SC = [0, 7.5, 15, 22.5, 30, 37.5, 45];           // six scenes, 7.5 s each
const NAMES = ['Order desk', 'Operations board', 'AI trade agents', 'RFQ to quote', 'Invoices & books', 'Insights, anywhere'];
const SUBS = ['Orders read, checked and staged by agents', 'Every shipment, every department, one file', 'Six agents watch the clock and the rules', 'Requests become costed quotes for approval', 'Aging, reminders and billing in one place', 'On every device, from one workspace'];
const E = 'cubic-bezier(.16,1,.3,1)';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const stage = $('#stage'), hud = $('#hud');
const anims = [], counters = [], typers = [], pings = [];

const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const add = (parent, html) => { const e = h(html); parent.appendChild(e); return e; };
function A(el, kf, at, dur, ease = E) {
  const a = el.animate(kf, { duration: Math.max(1, dur * 1000), delay: at * 1000, easing: ease, fill: 'both' });
  a.pause(); anims.push(a); return a;
}
const up = (el, at, dur = .7, dy = 36) => A(el, [{ opacity: 0, transform: `translateY(${dy}px)` }, { opacity: 1, transform: 'none' }], at, dur);
const fade = (el, at, dur = .5) => A(el, [{ opacity: 0 }, { opacity: 1 }], at, dur, 'ease-out');
const out = (el, at, dur = .4) => A(el, [{ opacity: 1 }, { opacity: 0 }], at, dur, 'ease-in');
const pop = (el, at, dur = .5) => A(el, [{ opacity: 0, transform: 'scale(.55)' }, { opacity: 1, transform: 'scale(1)' }], at, dur, 'cubic-bezier(.3,1.6,.5,1)');
const slide = (el, at, dx, dur = .8) => A(el, [{ opacity: 0, transform: `translateX(${dx}px)` }, { opacity: 1, transform: 'none' }], at, dur);
const glow = (el, at) => A(el, [{ boxShadow: '0 0 0 0 rgba(217,169,58,0)', borderColor: 'rgba(255,255,255,.09)' }, { boxShadow: '0 0 0 2px #d9a93a,0 0 50px rgba(217,169,58,.45)', borderColor: 'rgba(217,169,58,.9)' }], at, .4, 'ease-out');
const count = (el, from, to, at, dur, fmt) => counters.push({ el, from, to, at, dur, fmt: fmt || ((v) => Math.round(v).toLocaleString('en-US')) });
const typeText = (el, text, at, dur) => typers.push({ el, text, at, dur });
const ping = (...ts) => pings.push(...ts);
const money = (v) => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const ease = (p) => 1 - Math.pow(1 - Math.min(1, Math.max(0, p)), 3);

function scene(i, build) {
  const root = h('<div class="scene"><div class="cam"></div></div>');
  stage.insertBefore(root, hud);
  const cam = root.firstChild, st = SC[i], en = SC[i + 1];
  build(cam, st, en);
  const t0 = i === 0 ? 0 : st - 0.35, t1 = i === 5 ? TOTAL : en + 0.3, d = t1 - t0;
  A(root, [
    { opacity: i === 0 ? 1 : 0, offset: 0 },
    { opacity: 1, offset: i === 0 ? 0.0001 : (0.35 / d) },
    { opacity: 1, offset: i === 5 ? 1 : (en - 0.1 - t0) / d },
    { opacity: i === 5 ? 1 : 0, offset: 1 },
  ], t0, d, 'linear');
  A(cam, [{ transform: 'scale(1)' }, { transform: 'scale(1.05) translateY(-10px)' }], t0, d, 'linear');
  // lower third
  const lt = add(hud, `<div class="lower"><div class="n">0${i + 1}</div><div class="rule"></div><div><div class="t">${NAMES[i]}</div><div class="s">${SUBS[i]}</div></div></div>`);
  const a = i === 0 ? 3.15 : st + 0.35, b = i === 5 ? 41.0 : en - 0.3;
  A(lt, [{ opacity: 0, transform: 'translateX(-60px)' }, { opacity: 1, transform: 'none', offset: .12 }, { opacity: 1, transform: 'none', offset: .88 }, { opacity: 0, transform: 'translateX(30px)' }], a, b - a, 'ease-out');
  ping(st);
}

/* ===================== The real app chrome, rebuilt from the product's own styles ===================== */
const NAV = [
  ['TRADE & AI AGENTS', [['📬', 'Order desk'], ['🧭', 'Operations board'], ['🤖', 'AI agents'], ['🚢', 'Shipments']]],
  ['QUOTING', [['📥', 'RFQs to quotes'], ['⚙️', 'Quoting rules']]],
  ['INSIGHTS', [['📊', 'Overview'], ['⏱️', 'A/R & A/P aging'], ['📈', 'Sales breakdown'], ['🚨', 'Anomaly detection'], ['📐', 'Flux analysis']]],
  ['ACTIONS', [['🧾', 'Invoices'], ['📝', 'Estimates'], ['👥', 'Customers'], ['📦', 'Products & services'], ['🔗', 'Payment links & reminders']]],
];
function appFrame(cam, active, left = 180, top = 122) {
  const nav = NAV.map(([g, items]) => `<div class="grp"><div class="gl">${g}</div>${items.map(([i, n]) => `<div class="it${n === active ? ' on' : ''}"><span>${i}</span>${n}</div>`).join('')}</div>`).join('');
  const w = add(cam, `<div class="appwrap" style="left:${left}px;top:${top}px"><div class="app">
    <aside class="side"><div class="logoblk"><div class="lg"></div><div class="nm">GLOBLEXAI OFFICE ERP</div><div class="tgl2">AI-Powered Copilot</div></div>${nav}</aside>
    <div class="mainc"><header class="topb"><div><b>GloblexAI Office ERP</b><span>AI-Powered Copilot</span></div><em>Sign out</em></header>
    <div class="page"><div class="pg"></div></div></div></div></div>`);
  return { wrap: w, pg: $('.pg', w), page: $('.page', w) };
}
const head = (title, desc, btns = '') => `<div class="hd"><div><div class="h1">${title}</div><div class="ds">${desc}</div></div><div class="hb">${btns}</div></div>`;
const press = (el, at) => A(el, [{ transform: 'scale(1)', boxShadow: '0 0 0 0 rgba(0,112,230,0)' }, { transform: 'scale(.94)', boxShadow: '0 0 0 6px rgba(0,112,230,.35)', offset: .4 }, { transform: 'scale(1)', boxShadow: '0 0 0 0 rgba(0,112,230,0)' }], at, .5, 'ease-out');
const ring = (el, at) => A(el, [{ boxShadow: '0 1px 2px rgba(0,0,0,.04)', borderColor: '#e2e8f0' }, { boxShadow: '0 0 0 3px rgba(217,169,58,.85), 0 8px 30px rgba(217,169,58,.35)', borderColor: '#d9a93a' }], at, .35, 'ease-out');
const scrollTo = (el, at, dy, dur = 1.0) => A(el, [{ transform: 'translateY(0)' }, { transform: `translateY(${-dy}px)` }], at, dur, 'cubic-bezier(.65,0,.35,1)');

/* ============================ SCENE 1 · ORDER DESK ============================ */
scene(0, (c) => {
  // Opening card: the same brushed silver-and-black plate as the sign-in page
  const intro = add(c, `<div class="abs introbg" style="inset:-40px;background:var(--silverblack);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px">
    <div class="lgo" style="width:380px;height:253px;background:var(--logo) center/cover;border-radius:6px;box-shadow:0 0 120px rgba(217,169,58,.25)"></div>
    <div class="tgl" style="font-size:30px;letter-spacing:.3em;font-weight:700;color:#65c6ff">AI-POWERED COPILOT</div>
    <div class="nmx" style="font-size:44px;font-weight:700;letter-spacing:.02em">GloblexAI Office ERP</div>
    <div class="hdl" style="font-size:88px;line-height:1.05;font-weight:800;max-width:1500px">Run the business.<br><span class="gold">Let AI run the busywork.</span></div>
    <div class="trust" style="font-size:36px;color:#cbd5e1;letter-spacing:.04em"><b style="color:#fff">AI drafts. You decide.</b> Agents flag and prepare. People approve.</div></div>`);
  const k = intro.children;
  A(k[0], [{ opacity: 0, transform: 'scale(.9)' }, { opacity: 1, transform: 'scale(1)' }], .1, 1.0);
  fade(k[1], .5, .5); fade(k[2], .7, .5); up(k[3], .95, .8, 30); up(k[4], 1.55, .6, 20);
  out(intro, 2.35, .5);

  const f = appFrame(c, 'Order desk');
  up(f.wrap, 2.3, .8, 50);
  const pg = f.pg;
  const btnA = '<span class="bt s">Add customer message</span><span class="bt p addbtn">Add order</span>';
  add(pg, head('Order desk', 'Four agents take an order from the inbox to the carrier and answer customers along the way. They stop and ask a person only when something needs judgement.', btnA));
  const agents = [['Order Intake', 'Reads incoming orders, checks them and confirms the clean ones.'], ['Customer Service', 'Answers order questions from the order record and escalates the rest.'], ['Order Processing', 'Checks credit and stock, then reserves stock for confirmed orders.'], ['Shipping Processing', 'Picks the shipping method and ship-by date, and watches late and in-transit orders.']];
  const row = add(pg, `<div class="grid4">${agents.map(([n, d]) => `<div class="apc agc"><div class="rw"><b>${n}</b><span class="on"><i></i>Online</span></div><p>${d}</p><small>Last run <span class="lr">12m</span> ago</small></div>`).join('')}</div>`);
  const stats = [['Needs Review', 2], ['On Hold', 1], ['Confirmed', 0], ['Processing', 1], ['Ready To Ship', 4], ['Shipped', 18], ['Delivered', 31]];
  const st = add(pg, `<div class="stats">${stats.map(([n, v]) => `<div class="apc stc"><b class="sv" data-v="${v}">${v}</b><span>${n}</span></div>`).join('')}</div>`);
  const done = add(pg, `<div class="apc resl"><span class="bd g">Ready to ship</span><b>Order SO-261014-3338</b><span>12 × Steel bracket, 40 × Hex bolt M8 · stock reserved · ship-by date set</span></div>`);
  $$('.agc', row).forEach((a, i) => up(a, 2.6 + i * .1, .5, 20));
  fade(st, 3.0, .4);
  // click "Add order": panel with the incoming email typed in
  const addb = $('.addbtn', pg); press(addb, 3.4);
  const modal = add(f.page, `<div class="abs mdl" style="inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center">
    <div class="apc" style="width:520px;padding:20px 24px;background:#fff"><div style="font-size:16px;font-weight:600">Add an order</div><div style="font-size:12px;color:#64748b;margin:4px 0 10px">Paste the email or order text. The intake agent reads it.</div>
    <div class="mailx" style="border:1px solid #cbd5e1;border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.5;min-height:112px;white-space:pre-wrap;color:#0f172a"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><span class="bt s">Cancel</span><span class="bt p subm">Read and process</span></div></div></div>`);
  A(modal, [{ opacity: 0 }, { opacity: 1, offset: .08 }, { opacity: 1, offset: .9 }, { opacity: 0 }], 3.7, 2.1, 'linear');
  typeText($('.mailx', modal), 'Hello, please ship:\n12 x Steel bracket\n40 x Hex bolt M8\nPO AB-7781 · Springfield, IL', 3.9, 1.3);
  press($('.subm', modal), 5.35);
  // agents work: intake, processing, shipping
  [0, 2, 3].forEach((i, k) => { const a = $$('.agc', row)[i]; const t = 5.9 + k * .45; ring(a, t); count($('.lr', a), 12, 0, t, .3, (v) => (v < 1 ? '0m' : Math.round(v) + 'm')); ping(t); });
  A($$('.sv', st)[4], [{ transform: 'scale(1)', color: '#0f172a' }, { transform: 'scale(1.35)', color: '#0059b8' }, { transform: 'scale(1)', color: '#0059b8' }], 7.0, .6, 'ease-out');
  typers.push({ el: $$('.sv', st)[4], text: '5', at: 7.0, dur: .01, swap: '4' });
  fade(done, 6.8, .4); ping(6.9);
});

/* ============================ SCENE 2 · OPERATIONS BOARD ============================ */
scene(1, (c, st) => {
  const f = appFrame(c, 'Operations board');
  up(f.wrap, st + .15, .8, 50);
  const pg = f.pg;
  add(pg, head('Operations board', 'Customs, shipping, logistics, warehouse and accounts all work from the same file. Each file moves left to right.'));
  const depts = [['Customs brokerage', 3], ['Trade compliance', 5], ['Shipping & documentation', 4], ['Logistics & transport', 2], ['Warehouse', 1], ['Accounts', 6], ['Customer service', 2]];
  const dg = add(pg, `<div class="dgrid">${depts.map(([n, v]) => `<div class="apc dpc"><b>${n}</b><span class="bd g"><i class="dn" data-v="${v}">0</i> open</span></div>`).join('')}</div>`);
  $$('.dpc', dg).forEach((d, i) => up(d, st + .6 + i * .07, .45, 16));
  $$('.dn', dg).forEach((e, k) => count(e, 0, +e.dataset.v, st + .9 + k * .08, .8));
  ping(st + .9);
  const stages = ['BOOKED', 'IN TRANSIT', 'ARRIVED', 'CUSTOMS CLEARED', 'IN WAREHOUSE', 'DELIVERED', 'INVOICED'];
  const board = add(pg, `<div class="board">${stages.map((s) => `<div class="bcol"><div class="bh"><span>${s}</span><i class="bn">0</i></div></div>`).join('')}<div class="bcards"></div></div>`);
  fade(board, st + 1.2, .5);
  const cards = $('.bcards', board);
  const COLW = 118.5 + 6, X = (k) => k * COLW + 5, Y = (r) => 30 + r * 62;
  const layout = [[0, 0, 'SHP-00036', 'import'], [0, 1, 'SHP-00037', 'export'], [1, 0, 'SHP-00033', 'import'], [2, 0, 'SHP-00031', 'import'], [2, 1, 'SHP-00032', 'export'], [3, 0, 'SHP-00028', 'import'], [4, 0, 'SHP-00024', 'import'], [5, 0, 'SHP-00019', 'import'], [5, 1, 'SHP-00020', 'export'], [6, 0, 'SHP-00015', 'import']];
  const counts = [2, 1, 2, 1, 1, 2, 1];
  layout.forEach(([col, row, ref, kind], i) => { const e = add(cards, `<div class="apc bc" style="left:${X(col)}px;top:${Y(row)}px"><b>${ref}</b><small>${kind}</small></div>`); up(e, st + 1.5 + i * .08, .4, 14); });
  $$('.bn', board).forEach((e, k) => count(e, 0, counts[k], st + 1.6 + k * .1, .6));
  const hero = add(cards, `<div class="apc bc hero" style="left:0;top:${Y(2)}px"><b>SHP-00041</b><small>import</small></div>`);
  const t0 = st + 2.3, step = .78;
  const kf = [0, 1, 2, 3, 4, 5, 6].map((k) => ({ transform: `translateX(${X(k)}px)`, offset: k / 6, easing: 'cubic-bezier(.65,0,.25,1)' }));
  A(hero, [{ opacity: 0, transform: `translateX(${X(0)}px) scale(.8)`, offset: 0 }, { opacity: 1, transform: `translateX(${X(0)}px) scale(1)`, offset: .015 }, ...kf.slice(1)], t0 - .3, step * 6 + .3, 'linear');
  for (let k = 1; k <= 6; k++) ping(t0 - .3 + .3 + k * step);
  const toast = add(f.page, `<div class="abs" style="left:0;right:0;bottom:14px;text-align:center"><span class="bd b" style="font-size:13px;padding:6px 14px">SHP-00041 invoiced · every department worked from the same file</span></div>`);
  pop(toast, st + 7.0, .4);
});

/* ============================ SCENE 3 · AI AGENTS ============================ */
scene(2, (c, st) => {
  const f = appFrame(c, 'AI agents');
  up(f.wrap, st + .15, .8, 50);
  const pg = f.pg;
