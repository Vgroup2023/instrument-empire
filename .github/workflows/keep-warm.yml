name: Keep the app warm

# The app runs on serverless functions that go to sleep when nobody has used them for a few minutes, and the first
# page opened after that waits for one to wake up. A light request every few minutes keeps one awake. It reads no
# private data: the sign-in page and the status check are both public.
#
# GitHub may start scheduled runs a few minutes late, so this lowers the chance of a slow first page rather than
# removing it. It uses the APP_BASE_URL secret if set, otherwise the address below.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the app
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          BASE="${APP_BASE_URL:-https://globlexus.globlexai.com}"
          curl -sS -m 20 -o /dev/null -w "login %{http_code} in %{time_total}s\n" "$BASE/login" || true
          curl -sS -m 20 -o /dev/null -w "health %{http_code} in %{time_total}s\n" "$BASE/api/health" || true
